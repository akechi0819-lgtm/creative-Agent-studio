name: Canvas recovery verification

on:
  push:
    branches:
      - 'codex/canvas-recovery*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Canvas recovery on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2025
          - macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adapters/dsh/package-lock.json
            third_party/canvas/canvas-agent/package-lock.json
            third_party/canvas/web/package-lock.json

      - name: Install Studio root dependencies
        run: npm ci

      - name: Install DSH adapter dependencies
        working-directory: adapters/dsh
        run: npm ci

      - name: Install Canvas agent dependencies
        working-directory: third_party/canvas/canvas-agent
        run: npm ci

      - name: Install Canvas Web dependencies
        working-directory: third_party/canvas/web
        run: npm ci

      - name: Build Canvas agent
        working-directory: third_party/canvas/canvas-agent
        run: npm run build

      - name: Test Canvas bridge sessions
        working-directory: third_party/canvas/canvas-agent
        run: npm test

      - name: Typecheck Canvas Web
        working-directory: third_party/canvas/web
        run: npm run typecheck

      - name: Build Canvas Web
        working-directory: third_party/canvas/web
        run: npm run build

      - name: Build Studio Web
        run: npm run web:build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run isolated Canvas recovery tests and capture safe TAP
        shell: bash
        timeout-minutes: 30
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          STUDIO_TEST_HEADED: ${{ matrix.runner == 'windows-2025' && '1' || '0' }}
        run: |
          set -euo pipefail
          node --test --test-reporter=tap --test-timeout=180000 \
            tests/launcher.test.mjs \
            tests/release-startup.test.mjs \
            tests/windows-launcher-ui.test.mjs \
            tests/web-api.test.mjs \
            tests/entry.test.mjs \
            tests/canvas-client.test.mjs \
            tests/canvas-connection.test.mjs \
            tests/canvas-window.test.mjs \
            tests/web-canvas-recovery.test.mjs \
            tests/web-canvas.test.mjs \
            tests/web-canvas-config-sync.test.mjs \
            tests/page-edit-agent.test.mjs \
            2>&1 | node -e 'let output = ""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => output += chunk); process.stdin.on("end", () => { const safeOutput = output.replace(/https?:\/\/[^\s"<>]+/g, "[redacted URL]"); require("node:fs").writeFileSync(require("node:path").join(process.env.RUNNER_TEMP_DIR, "canvas-recovery.tap"), safeOutput, "utf8"); });'

      - name: Upload safe TAP result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-recovery-tap-${{ matrix.runner }}
          path: ${{ runner.temp }}/canvas-recovery.tap
          if-no-files-found: warn
          retention-days: 7
