name: Company Lite packages

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: company-lite.1
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} on its native runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Build and verify the native WorkBuddy capability package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="$REF_NAME"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            VERSION="company-lite-pr.${PR_NUMBER}.${RUN_NUMBER}"
          else
            VERSION="$INPUT_VERSION"
          fi
          node scripts/package-release.mjs \
            --target "$TARGET" \
            --version "$VERSION" \
            --output "$RUNNER_TEMP_DIR/release-output"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/release-output/Creative-Agent-Studio-CompanyLite-*.zip*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'darwin-arm64'
        with:
          name: creative-studio-skill
          path: ${{ runner.temp }}/release-output/creative-studio-skill.zip*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Check package and license manifests
        run: |
          python3 - <<'PY'
          import glob, json, zipfile
          archives = glob.glob('release-assets/Creative-Agent-Studio-CompanyLite-*.zip')
          if len(archives) != 2:
              raise SystemExit(f'Expected two native Company Lite packages, found {len(archives)}')
          for archive in archives:
              with zipfile.ZipFile(archive) as bundle:
                  names = set(bundle.namelist())
                  manifests = [name for name in names if name.endswith('/release-manifest.json') and name.count('/') == 1]
                  inventories = [name for name in names if name.endswith('/THIRD-PARTY-LICENSES.json')]
                  if len(manifests) != 1 or len(inventories) != 1:
                      raise SystemExit(f'{archive}: root manifest or third-party inventory is missing or ambiguous')
                  manifest = json.loads(bundle.read(manifests[0]))
                  inventory = json.loads(bundle.read(inventories[0]))
                  if manifest.get('product') != 'Creative Agent Studio Company Lite':
                      raise SystemExit(f'{archive}: wrong product manifest')
                  if manifest.get('nodeVersion') != '22.23.3':
                      raise SystemExit(f'{archive}: wrong Node version')
                  if inventory.get('runtime', {}).get('target') != manifest.get('target'):
                      raise SystemExit(f'{archive}: third-party inventory target mismatch')
                  if any(not item.get('license') for item in inventory.get('npm', [])):
                      raise SystemExit(f'{archive}: missing dependency license metadata')
                  root = manifests[0].rsplit('/', 1)[0]
                  target = manifest.get('target')
                  if target == 'darwin-arm64':
                      wrappers = ('Start.command', 'Studio.command')
                      node = '.studio-runtime/node/node-v22.23.3-darwin-arm64/bin/node'
                  elif target == 'win32-x64':
                      wrappers = ('Start.cmd', 'Studio.cmd')
                      node = '.studio-runtime/node/node-v22.23.3-win-x64/node.exe'
                  else:
                      raise SystemExit(f'{archive}: unsupported native package target {target!r}')
                  required = [f'{root}/{name}' for name in ('README.md', 'AGENTS.md',
                              'Creative_Agent_Studio_PRD.md', '开发与施工计划.md', *wrappers,
                              'docs/README.md', 'docs/代理宿主使用.md',
                              'scripts/setup.mjs', 'scripts/studio.mjs',
                              'scripts/canvas-supervisor.mjs', 'scripts/canvas-mcp.mjs',
                              node, 'third_party/canvas/canvas-agent/dist/index.js',
                              'third_party/canvas/web/dist/index.html',
                              '.agents/skills/creative-studio/SKILL.md',
                              '.agents/skills/creative-studio/references/workbuddy-entry.md')]
                  if any(name not in names for name in required):
                      raise SystemExit(f'{archive}: WorkBuddy capability-root files are missing')
                  if any('.app/' in name for name in names):
                      raise SystemExit(f'{archive}: standalone application wrappers are not part of Company Lite')
          print('Both native Company Lite packages passed manifest checks.')
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --verify-tag --generate-notes --title "Creative Agent Studio Company Lite $TAG"
