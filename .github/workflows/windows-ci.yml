name: Company Lite CI

on:
  push:
    branches: [codex/company-lite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows prepare and tests
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      STUDIO_DATA_DIR: ${{ runner.temp }}\company-lite-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            third_party/canvas/canvas-agent/package-lock.json
            third_party/canvas/web/package-lock.json
      - name: Prepare root and Canvas runtime
        run: node scripts/prepare.mjs
      - name: Run Company Lite and Canvas tests
        run: npm test
